# Build nftsim and run its unit and numerical regression tests.
#
# Jobs: g++ and clang++ on Linux, Apple clang on macOS, and a sanitizer build
# on Linux. White noise is generated portably (src/random.cpp), so the whole
# suite passes with libc++ on macOS as well as libstdc++ on Linux.
#
# The numerical check (nf_numerical --check all) compares each output with its
# reference in test/numerical/data within a tolerance (rtol 1e-9 of each
# column's largest value), which absorbs round-off from different compilers,
# optimisation levels and CPUs. Each job also runs the numerical tests with
# binary output (--format Binary, and Binary32 at a float32 tolerance), read
# back and checked against the same text references.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} (Makefile build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v5
      - name: Show compiler version
        run: $CXX --version
      - name: Build nftsim
        # The Makefile's Linux flags (-O3 -flto -march=native ...) apply to both compilers.
        run: make -j"$(nproc)" nftsim CXX="$CXX"
      - name: Unit tests
        run: make test-unit CXX="$CXX"
      - name: Numerical regression tests
        run: ./nf_numerical --check all
      - name: Numerical regression tests, binary output
        run: |
          ./nf_numerical --check all --format Binary
          ./nf_numerical --check all --format Binary32 --rtol 1e-6

  macos:
    name: Apple clang (macOS, Makefile build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show compiler version
        run: clang++ --version
      - name: Build nftsim
        # The Makefile's macOS flags (clang++ -O3 -flto -march=native ...).
        run: make -j"$(sysctl -n hw.ncpu)" nftsim
      - name: Unit tests
        run: make test-unit
      - name: Numerical regression tests
        run: ./nf_numerical --check all
      - name: Numerical regression tests, binary output
        run: |
          ./nf_numerical --check all --format Binary
          ./nf_numerical --check all --format Binary32 --rtol 1e-6

  python-reader:
    name: Python output reader (utils/nftsim.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        # Only numpy: reading output must not need matplotlib.
        run: python -m pip install numpy
      - name: Build nftsim
        # For the tests that compare nftsim's binary and text output.
        run: make -j"$(nproc)" nftsim
      - name: Reader tests
        run: python -m unittest discover -s test/python -v

  matlab-reader:
    name: Matlab output reader (+nf/read.m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build nftsim
        run: make -j"$(nproc)" nftsim
      - uses: matlab-actions/setup-matlab@v2
        # MathWorks licenses MATLAB for CI on public repositories.
        with:
          release: latest
      - name: Reader tests (text, Binary and Binary32)
        uses: matlab-actions/run-command@v2
        with:
          command: run('test/matlab/test_read.m'); run('test/matlab/test_run.m')

  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer (clang++)
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      SAN_FLAGS: -std=c++11 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all
      # Any report (including a leak) makes the program exit non-zero, which
      # fails the unit tests or the nftsim run inside nf_numerical.
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_init_order=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - name: Build nftsim and unit tests with sanitizers
        run: make -j"$(nproc)" nftsim bin/unit_tests CXX="$CXX" CXXFLAGS="$SAN_FLAGS"
      - name: Unit tests
        run: ./bin/unit_tests
      - name: Numerical regression tests
        run: ./nf_numerical --check all
      - name: Numerical regression tests, binary output
        run: |
          ./nf_numerical --check all --format Binary
          ./nf_numerical --check all --format Binary32 --rtol 1e-6
