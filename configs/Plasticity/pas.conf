Paired associative stimulation (PAS) with CaDP plasticity on coupling 2.
It was meant to reproduce the signature timing window of PAS (depression or
potentiation depending on ISI), but has not been shown to do so. With these
parameters nutilde rises by about 2% in 2 s for any ISI from -20 to 50 ms.
Coupling 2 used to be fCaP, an experimental fractional-order variant of
CaDP (fractional orders lambda, mu and zeta) that was removed from nftsim in
2013. It is now plain CaDP with the parameters of the other plasticity
configurations (bcm.conf, tbs.conf), including their gNMDA of 2e-3, which
is the CaDP default.
